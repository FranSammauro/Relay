# CI mínimo: compila el workspace y corre los tests contra un Postgres real.
# Existe primero que nada para que el test de concurrencia de Fase 2 (100
# jobs / 10 workers) tenga sentido -- sin una base real levantada, ese test
# se limita a saltarse solo (ver crates/common/tests/concurrency.rs).
#
# El pipeline "de verdad" (build de imágenes, push a un registry, releases)
# llega en Fase 8 junto con el resto del pulido de producción.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: queue
          POSTGRES_PASSWORD: queue
          POSTGRES_DB: queue
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U queue"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        # Fase 4: no la usa ningún test todavía (la recuperación de jobs
        # corre solo sobre Postgres, ver ADR-002), pero mantenemos el
        # entorno de CI representativo del real por si el día de mañana
        # se agrega un test de heartbeats.
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://queue:queue@localhost:5432/queue
      TEST_DATABASE_URL: postgres://queue:queue@localhost:5432/queue
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      # usamos el rustc de apt a propósito, no rustup: es el mismo
      # toolchain "viejo" contra el que están pineadas las dependencias
      # en Cargo.toml/Cargo.lock (ver comentario ahí). Si el día de mañana
      # se sube el MSRV del proyecto, este es el lugar donde hay que
      # cambiarlo también.
      - name: Instalar Rust (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y rustc cargo
          rustc --version
          cargo --version

      - name: Cache de cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo check --workspace
        run: cargo check --workspace

      - name: cargo test --workspace
        run: cargo test --workspace
