version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: queue
      POSTGRES_PASSWORD: queue
      POSTGRES_DB: queue
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queue"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    # Fase 4: coordinación efímera (heartbeats de worker, ver ADR-002).
    # A propósito no tiene volumen -- si se reinicia, perder los
    # heartbeats no compromete nada, se reconstruyen solos en unos
    # segundos con el próximo latido de cada worker.
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgres://queue:queue@postgres:5432/queue
      REDIS_URL: redis://redis:6379
      API_ADDR: 0.0.0.0:8080
      RUST_LOG: info
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgres://queue:queue@postgres:5432/queue
      REDIS_URL: redis://redis:6379
      CONCURRENCY: 4
      HEARTBEAT_INTERVAL_MS: 5000
      REAPER_INTERVAL_MS: 15000
      SCHEDULER_INTERVAL_MS: 10000
      SHUTDOWN_GRACE_SECONDS: 30
      RUST_LOG: info
    # Docker manda SIGTERM y espera esto antes de mandar SIGKILL. Tiene que
    # ser mayor a SHUTDOWN_GRACE_SECONDS -- si no, Docker mata el proceso a
    # la fuerza antes de que termine de drenar los jobs en vuelo, exactamente
    # lo que graceful shutdown existe para evitar (Fase 6).
    stop_grace_period: 35s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    deploy:
      # Fase 2: varios workers compitiendo de verdad por trabajo via
      # SKIP LOCKED. Subilo o bajalo con `docker compose up --scale worker=N`.
      # Desde Fase 4 esto también significa varios reapers redundantes
      # (ver ADR-004): matá uno con `docker kill <container>` a mitad de
      # un job y mirá cómo otro lo recupera solo.
      # Desde Fase 5 también significa varios candidatos a líder del
      # scheduler de cron (ver ADR-006): solo uno gana el advisory lock a
      # la vez; si lo matás, otro toma la posta en el próximo intento.
      replicas: 3

volumes:
  pgdata:
